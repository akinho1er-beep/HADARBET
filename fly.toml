# ============================================================
#  HADAR BetAnalytics — configuration Fly.io
#  Documentation : FLY-IO-PAS-A-PAS.md
# ============================================================

# ⚠️ Ce nom doit être unique dans le monde entier.
# S'il est déjà pris, change-le (ex : hadar-bet-ak, hadar-bet-2026)
app = "hadar-betanalytics"
primary_region = "cdg"          # Paris — proche du Bénin, et 1xBet y répond

[build]
  dockerfile = "Dockerfile"

[env]
  PORT              = "3000"
  DATA_DIR          = "/data"                # le disque persistant
  MAX_RESULTS       = "5000"
  PUPPETEER_ENABLED = "false"
  ONEXBET_BASE_URL  = "https://1xbet.bj"
  ALLOWED_ORIGINS   = ""

# Disque persistant : tes ~19 845 résultats y sont recopiés au 1er démarrage
[[mounts]]
  source      = "hadar_data"
  destination = "/data"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = false      # ne s'endort JAMAIS
  auto_start_machines  = true
  min_machines_running = 1          # toujours allumé

  [[http_service.checks]]
    interval      = "30s"
    timeout       = "5s"
    grace_period  = "20s"
    method        = "GET"
    path          = "/health"

# 256 Mo suffisent (l'application tourne autour de 70-95 Mo).
# Si Fly redémarre pour manque de mémoire, passe à "512mb".
[[vm]]
  size     = "shared-cpu-1x"
  memory   = "256mb"
